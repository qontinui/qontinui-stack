sha256_source = "download; equals /garage in docker.io/dxflrs/garage:v2.5.0 linux/amd64 (manifest sha256:23b16d34e0348d9aca9b960a7429a7e6d494974b5288bfb8f6c3ab856895f71e, layer sha256:8da82df9bbd402ca27f344d3995d457f5c21a83dbb6c8af5e9e952859699c003)"
license_url = "https://git.deuxfleurs.fr/Deuxfleurs/garage/raw/tag/v2.5.0/LICENSE"
license_sha256 = "0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0"
