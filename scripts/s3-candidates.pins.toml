# Pins for scripts/s3-candidates.sh — the D8 object-store candidates and the
# two real clients of the stack's store, each fetched by version and sha256.
#
# Plan 2026-11-22-fetches-stop-depending-on-upstreams, Phase 1. These live
# beside s3-candidates.sh because Phase 1 runs before Phase 3 creates the
# fleet pin manifest (qontinui-claude-config scripts/substrate/fetch-pins.toml);
# Phase 3 absorbs them.
#
# Release-age cooldown (D5): `pinned_at - released_at` must be >= 14 days, and
# s3-candidates.sh refuses an entry that is not, unless it carries a
# `cooldown_waiver`. `released_at` was read from the upstream release API
# (GitHub `published_at`; Garage's Forgejo `published_at`), never typed from
# memory.
#
# `sha256_source` says how the digest was established. For the GitHub assets
# the digest was read from the release API's per-asset `digest` field and
# matched by a local `sha256sum` of the download (and, where the project ships
# one, its own checksum file). Garage publishes no checksum file: the digest
# was taken from the download and matched against the `garage` binary inside
# the project's own `dxflrs/garage:v2.5.0` linux/amd64 image layer — two
# independent distribution channels agreeing.
#
# `license_*`: the LICENSE file read at the pinned tag (D8: "Each candidate's
# licence is read from its LICENSE file at the pinned tag"); the sha256 pins
# exactly which text was screened.

cooldown_days = 14

[[candidate]]
name = "garage"
version = "v2.5.0"
released_at = "2026-10-24"
pinned_at = "2026-11-22"
