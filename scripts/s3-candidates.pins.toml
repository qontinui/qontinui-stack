# Screened out before the run, by footprint (D8: "not one process under
# 512 MiB idle"). Recorded, not hidden.
[[screened_out]]
name = "ceph-rgw"
governance = "foundation"
governance_note = "Ceph Foundation (Linux Foundation); LGPL-2.1/3.0"
reason = "not one process under 512 MiB idle: radosgw needs a RADOS cluster behind it (at least ceph-mon + ceph-osd, plus ceph-mgr in practice); the project's own minimum table sets ceph-mon RAM >= 5 GB per daemon and ceph-osd RAM >= 4 GiB per OSD"
evidence_url = "https://raw.githubusercontent.com/ceph/ceph/ce12032d534773d03610918d37abc7fb95eaa644/doc/start/minimum-hardware.rst"
evidence_sha256 = "a840c99e35ff7b99483cd07e2d12b2854610858b75106fcb96aae80fb903de83"

