name: qontinui CI

# DO NOT DELETE THE `push:` TRIGGER, and do not narrow it past the branch list
# below. coord's merge train pushes `merge-candidate/<uuid>` and waits
# `awaiting-ci` for check-runs on that ref. A `pull_request`-only workflow can
# never satisfy it: the train times out at COORD_MERGE_CI_TIMEOUT (1800s),
# requeues forever, and permanently consumes one of COORD_MERGE_SLOTS
# (default 3) — a standing 33% tax on fleet merge concurrency whose symptom
# points at innocent repos. This workflow is currently the ONLY thing satisfying
# candidate CI for qontinui-stack.
#
# The three `merge-candidate*` prefixes are coord's authoritative list
# (`ci_observer.rs` CANDIDATE_BRANCH_PREFIXES_EXACT). Omitting one wedges the
# train. `main` must stay too: coord's head-baseline axis needs a `push`
# trigger that CAN fire on the default branch (`ci_baseline.rs`, the
# `qontinui-dev-notes` note at the `no_candidate_producer` doc comment).
#
# WHY THIS IS SCOPED RATHER THAN THE `on: [push, pull_request]` IT REPLACED.
# An UNFILTERED `push:` also fired on every PR head branch, so every PR ran
# this workflow TWICE against the same head SHA — two runs of identical work
# competing for the same hosted-runner pool, and the PR pinned at
# mergeStateStatus=UNSTABLE until the slower duplicate drained. Measured on
# PR #76 (2026-08-31): head SHA 9763836e carried run 33358773746 (push, 693s)
# and run 33358792294 (pull_request, 1219s) for jobs that execute in 13-16s;
# the PR was held ~20 minutes. A `concurrency:` block does NOT fix this —
# `github.ref` differs by event (`refs/heads/<branch>` vs `refs/pull/<n>/merge`)
# so the two runs land in different groups; qontinui-docs and qontinui-gym
# carry `cancel-in-progress: true` and still emit both runs at one SHA.
# Plan: 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run.
#
# `pull_request:` is deliberately left UNFILTERED so stacked PRs based on a
# long-lived integration branch still get CI (the runner #651/#652 class).
on:
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:

# Explicitly read-only. This repo is PUBLIC and its terraform state holds 12
# plaintext secret values, so nothing here may ever acquire AWS credentials —
# see the note on the validate job below.
permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Both checks below are CREDENTIAL-FREE and STATE-FREE by construction:
      # `fmt` reads source only, and `init -backend=false` deliberately does not
      # configure the S3 backend, so no state object is fetched and no AWS
      # principal is needed.
      #
      # This is the boundary the whole Phase 3b design rests on. The FULL
      # `terraform plan` — the one that actually detects drift — is NOT run
      # here and must never be: a plan refreshes the 12
      # `aws_secretsmanager_secret_version` resources, and the S3 state object
      # itself carries their values in plaintext, so `-refresh=false` does not
      # help either. Any principal that can run it holds the production DSN, the
      # RDS master password, the coord admin secret, the web service secret, the
      # Redis auth token and the metrics token. Fork PRs correctly receive no
      # secrets, so such a job would be dead exactly where review matters most,
      # and `pull_request_target` is forbidden outright — it would hand
      # fork-authored code the secret-bearing context.
      #
      # The plan runs instead as a scheduled job on a box that ALREADY holds
      # those credentials, posting only a classification to coord:
      # `scripts/terraform-plan-drift.py` -> `POST /coord/infra/plan-drift`.
      # Plan: 2026-08-15-terraform-plan-infra-observer-phase-3b.
      - name: terraform fmt
        run: terraform fmt -check -recursive aws/

      # `-lockfile=readonly` makes this job HERMETIC: it installs exactly the
      # provider versions + checksums in the checked-in
      # aws/staging/.terraform.lock.hcl and fails rather than silently resolving
      # something newer. Without it a future hashicorp/aws 5.x release could turn
      # this workflow red with no commit to the repo — and this workflow is what
      # satisfies coord's candidate CI, so that red wedges a merge slot.
      - name: terraform init (no backend, locked)
        run: terraform -chdir=aws/staging init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform -chdir=aws/staging validate

      # Same credential-free, state-free class as the two checks above: it reads
      # `aws/**/*.tf` and nothing else. It lives in THIS job rather than with the
      # python tests because it is a terraform source check and its failure is
      # addressed by editing a `.tf` file.
      #
      # It exists because `validate` cannot see the thing it checks. Terraform
      # redacts a plan diff only for attributes somebody marked `sensitive`, and
      # PR #70 found the operator's personal address rendering verbatim in every
      # plan diff of this PUBLIC repo because one `variable` block was missing
      # the marker — through `fmt`, `validate` and a green test suite. The note
      # that fix left in docs/terraform-state-secret-inventory.md says the class
      # "recurs the next time a value is added without the marker". This is what
      # catches the next one.
      #
      # Stdlib only, deliberately: `python3` is preinstalled on ubuntu-latest, so
      # this needs no `setup-python` and no `pip install`. Keep it that way — a
      # dependency here is a supply-chain edge on a credential-free job.
      - name: terraform sensitivity lint
        run: python3 scripts/terraform-sensitive-lint.py aws

  drift-classifier:
    name: python script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pytest
        # boto3: cognito_presignup_autolink/handler.py imports it at module
        # level (its tests stub the CLIENT, not the import). The operator pager
        # relay imports it lazily and needs none of it.
        run: python -m pip install --quiet pytest boto3
      # The WHOLE scripts/tests/ directory, not just the drift classifier: the
      # `noop` placeholder this job replaced meant test_plan_graph.py,
      # test_resolve_plan_deps.py and test_symbol_claims_by_machine.py had never
      # been run by CI at all. All of them are credential-free — the drift tests
      # run the classifier over synthetic `terraform show -json` documents, never
      # a real plan. One asserts the scrubbing invariant (no before/after value
      # can reach a posted record), which is worth having on every push.
      #
      # `aws/lambdas/` too (plan 2026-10-14-coord-pages-the-operator-for-five-
      # conditions-and-names-the-agent-fixing-each, Phase 1): before this, no job
      # ran cognito_presignup_autolink/test_handler.py at all, and the operator
      # pager relay's tests are the gate for its cap, wording and retry rules.
      # Neither makes an AWS call: the presignup tests stub the boto3 client
      # (boto3 itself is installed above, for its module-level import) and the
      # relay imports boto3 lazily. pytest's summary line is the count of tests run.
      - name: pytest
        run: python -m pytest scripts/tests/ aws/lambdas/ -q

  # The stack's object store passes the D7 conformance subset — and so does its
  # fallback — on every PR and merge candidate (plan 2026-11-22-fetches-stop-
  # depending-on-upstreams, Phase 2). Two arms, both required:
  #
  #   1. `object-store` (versitygw, built from ./object-store) alone, then the
  #      `object-store-init` sidecar, then scripts/s3-store-check.sh: the seven
  #      operations (7/7 or red), the three init buckets with qontinui-dev
  #      anonymous-download and the cold-tier bucket private, and the sccache
  #      stats server's live S3 listing test.
  #   2. The same under `--profile fallback-store` with `object-store-seaweedfs`
  #      answering as `object-store` — the fallback REHEARSAL, run every time so
  #      the fallback is known to work before it is needed, not after.
  #
  # So a PR that swaps in a store failing the subset, or breaks the fallback,
  # goes red here. Credential-free and zero-spend: GitHub-hosted runner, a
  # throwaway key pair, no AWS principal (the `permissions: contents: read`
  # above still holds). Images are digest-pinned in docker-compose.yml.
  s3-store-conformance:
    name: s3 store conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S3_ACCESS_KEY: ci-conformance-access
      S3_SECRET_KEY: ci-conformance-secret-not-a-real-secret
      S3_API_PORT: "9100"
      OUT_DIR: s3-conformance-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install boto3 and pytest
        run: python -m pip install --quiet boto3==1.43.126 pytest

      - name: "arm 1: versitygw — start object-store and create the buckets"
        run: |
          docker compose up -d --build --wait object-store
          bash scripts/s3-store-check.sh wait-writable
          docker compose run --rm object-store-init
      - name: "arm 1: versitygw — conformance, buckets, stats"
        run: bash scripts/s3-store-check.sh check versitygw
      - name: "arm 1: logs on failure"
        if: failure()
        run: docker compose logs object-store object-store-init
      - name: "arm 1: stop"
        if: always()
        run: docker compose down -v

      - name: "arm 2: SeaweedFS fallback — start object-store-seaweedfs and create the buckets"
        # Runs even when arm 1 failed, so one red shows both verdicts.
        if: ${{ !cancelled() }}
        run: |
          docker compose --profile fallback-store up -d --wait object-store-seaweedfs
          bash scripts/s3-store-check.sh wait-writable
          docker compose run --rm --no-deps object-store-init
      - name: "arm 2: SeaweedFS fallback — conformance, buckets, stats"
        # Runs even when arm 1 failed, so one red shows both verdicts.
        if: ${{ !cancelled() }}
        run: bash scripts/s3-store-check.sh check seaweedfs
      - name: "arm 2: logs on failure"
        if: failure()
        run: docker compose --profile fallback-store logs object-store-seaweedfs
      - name: "arm 2: stop"
        if: always()
        run: docker compose --profile fallback-store down -v

      # Arm 3: qontinui-web's compose pulls the upstream versitygw image by
      # digest (v1.10.0, outside the cooldown) instead of building
      # ./object-store. Its conformance is re-checked here so that pin is not
      # an unverified claim. Keep this digest equal to qontinui-web's
      # docker-compose.yml `object-store` image. `-v /data` is an anonymous
      # local volume (ext4 on the runner, so user xattrs work); the stop step's
      # `rm -fv` removes it.
      - name: "arm 3: qontinui-web's versitygw image — conformance"
        if: ${{ !cancelled() }}
        env:
          WEB_STORE_IMAGE: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
        run: |
          docker run -d --name web-object-store -p 127.0.0.1:9200:9000 \
            -e ROOT_ACCESS_KEY="$S3_ACCESS_KEY" -e ROOT_SECRET_KEY="$S3_SECRET_KEY" \
            -v /data "$WEB_STORE_IMAGE" --port :9000 --health /health posix /data
          S3_ENDPOINT=http://127.0.0.1:9200 bash scripts/s3-store-check.sh wait-writable
          mkdir -p "$OUT_DIR"
          python3 scripts/s3-conformance.py --endpoint http://127.0.0.1:9200 \
            --access-key-env S3_ACCESS_KEY --secret-key-env S3_SECRET_KEY \
            --bucket conformance-web-image --label versitygw-web-image \
            --json-out "$OUT_DIR/s3-conformance-versitygw-web-image.json"
      - name: "arm 3: stop"
        if: always()
        run: docker rm -fv web-object-store || true

      - name: keep the conformance records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-store-conformance
          path: s3-conformance-results/
          if-no-files-found: warn
