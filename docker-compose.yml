# qontinui-stack — canonical database stack for the canonical-DB topology.
#
# This is the authoritative dev/self-host/cloud-equivalent backplane. It runs
# Postgres 16 (with pgvector), Redis 7, and an S3-compatible object store
# (versitygw), plus a one-shot alembic migrator that brings the schema to head
# on `up`.
#
# Topology plan: D:\qontinui-root\tmp_canonical_db_topology_plan.md (§9 Phase 1).
#
# Port choices: 5433 / 6380 / 9100 — deliberately offset from the current
# qontinui-web stack (5432 / 6379 / 9000) so both can run side-by-side
# during the cutover. After cutover completes (per topology plan §10), the
# qontinui-web stack is decommissioned and this stack can move to the
# standard ports if desired.
#
# Service summary:
#   postgres   — canonical PG; pgvector enabled; four schemas pre-created.
#   redis      — claims, pub/sub, presence; sub-second TTL primitives.
#   object-store — S3-compatible blob (versitygw); dev-only; staging+prod
#                use real S3. `object-store-seaweedfs` is its fallback, behind
#                the `fallback-store` profile.
#   migrator   — one-shot, runs `alembic upgrade head` on `up`, then exits.
#   nats-1..3  — JetStream cluster for durable, replayable events
#                (Row 9 Phase 1 — failure-modes-at-scale design §3.1).
#
# Connection strings for ~/.qontinui/profiles.json (dev profile):
#   postgres://qontinui_user:qontinui_dev_password@<host>:5433/qontinui_db
#   redis://<host>:6380/0
#   http://<host>:9100   (object store S3 API; there is no console port)
#
# <host> is the PC's LAN IP (typically 192.168.x.x), exposed to MSI laptop
# and the third machine over LAN. Topology plan §9 Phase 2 covers exposure.

# ═══════════════════════════════════════════════════════════════════════════
# `pids_limit: 4096` on every service — why, and why that number.
#
# 2026-08-27 incident: no process in the Docker VM could fork(). Every
# `docker exec` returned EAGAIN, no container could start, and all 16
# containers rendered `(unhealthy)`. Cause: `qontinui-canonical-coord` alone
# held **190,840** PIDs — 99.3% of the VM's `/proc/sys/kernel/threads-max`
# (192,146) — while every other container sat at <= 68. `docker inspect`
# showed `PidsLimit=<nil>` on all of them: nothing bounded any cgroup, so one
# container's leak consumed the whole shared kernel task table and took its
# twelve blameless neighbours down with it.
#
# coord PR #1671 fixed the LEAK: the image now runs under
# `ENTRYPOINT ["/usr/bin/tini","-s","--",…]` so the orphans of coord's ~148
# `git` invocations get reaped instead of accumulating as zombies. That is
# the right fix and it is not duplicated here.
#
# This is the other half. **A reaper prevents THAT leak; a pids_limit
# contains ANY future one.** Without a cgroup bound the blast radius of the
# next unbounded-task bug — in any service, from any image we do not write —
# is still "the entire VM".
#
# Why 4096, argued rather than picked:
#
#   * ~60x steady state. Measured again 2026-08-29 via `docker stats`: the
#     busiest container in this stack was 68 PIDs (sccache); postgres 18,
#     nats 17-19, jaeger 18, bazel-remote 34, the object
#     store's predecessor 30, redis 6. The same
#     <= 68 held for every container during the incident. The healthy
#     working set is two orders of magnitude below this cap.
#   * ~8x coord's worst legitimate burst. coord fans out to ~148 concurrent
#     `git` invocations in a merge-train window; at 1-3 tasks apiece that is
#     ~450, plus its own tokio runtime on this 32-core VM (~40-70 threads)
#     — call it ~520 tasks. 4096 does not throttle that, which is the point:
#     a bound that clips legitimate work would be traded away the first time
#     it fired.
#   * 2.1% of `threads-max` (4096 / 192,146). One container can no longer
#     reach even a fiftieth of the kernel task table.
#   * The AGGREGATE is the invariant that actually matters, and it only
#     holds if the bound is universal: 14 services x 4096 = 57,344 = **29.8%**
#     of `threads-max` (15 services are defined; `object-store-seaweedfs`
#     stands in for `object-store`, never beside it, so 14 run at once).
#     Even a simultaneous stack-wide worst case leaves the
#     VM able to fork — which is exactly what 2026-08-27 took away.
#
# Applied to every service, not just coord. Bounding only the container that
# leaked last time protects against a repeat, not against the class, and the
# aggregate ceiling above is the whole containment argument. The number is
# defensible per-service because the <= 68 measurement covers all of them;
# the one service with a larger DECLARED legitimate ceiling is postgres
# (`max_connections=200` -> ~215 backends plus background workers), and 4096
# is still ~19x that.
#
# **A starting point to calibrate, not a constant to defend.** Plan
# 2026-08-27-fleet-telemetry-has-no-saturation-dimension-but-memory Phase 1
# adds `pids_used` / `pids_max` to the sample schema precisely so this number
# stops being an estimate — and this setting is what makes `pids_max`
# non-NULL on the `container` lane at all. Without it that lane reports NULL
# forever and Phase 2's saturation ratio renders `unknown`: correct, but
# blind, which is that plan's own complaint.
#
# Takes effect at the next container CREATE (`docker compose up -d` will
# recreate; a running container is not retroactively bounded).
# ═══════════════════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════════════
# Image pins. Every third-party `image:` is `<name>:<tag>@sha256:<digest>`
# with `# released: … pinned: …` at least 14 days apart (plan
# 2026-11-22-fetches-stop-depending-on-upstreams, D5). `released` is Docker
# Hub's `tag_last_pushed` for the tag whose current digest is the pinned one
# (a push date, read 2026-11-22), not the upstream project's release date.
# scripts/tests/test_image_pins.py checks format and age only, offline; it
# cannot detect a wrong digest or date. Its docstring records the method.
# ═══════════════════════════════════════════════════════════════════════════
services:
  # ───────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 + pgvector — canonical durable state.
  # ───────────────────────────────────────────────────────────────────────
  postgres:
    # pgvector 0.8.6 on PG 16, the newest pg16 build outside the 14-day
    # cooldown on the pin date (0.8.7-pg16 was pushed 2026-11-12).
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b # released: 2026-08-13 pinned: 2026-11-22
    container_name: qontinui-canonical-postgres
    restart: unless-stopped
    # PID containment — see the block above `services:` for the argument.
    # `max_connections=200` below is the largest declared legitimate demand
    # in this stack (~215 tasks with background workers); 4096 is ~19x it.
    pids_limit: 4096
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qontinui_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qontinui_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-qontinui_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - canonical_postgres_data:/var/lib/postgresql/data
      # Bootstrap scripts run only on first container start (when the data
      # volume is empty). Idempotent ON CONFLICT-style guards inside the
      # scripts make them safe to re-run if the volume is wiped.
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    # Same hardening the qontinui-web stack uses (qontinui-web/docker-compose.yml:22-27)
    # — bounded idle-in-transaction timeout + TCP keepalives so abandoned
    # backends from crashed dev runners get cleaned up promptly. Without
    # these, a single dev session can leak 10+ orphan backends before
    # container restart.
    command: >
      postgres
      -c idle_in_transaction_session_timeout=300000
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=6
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qontinui_user} -d ${POSTGRES_DB:-qontinui_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────
  # Redis 7 — claims, pub/sub, presence.
  # ───────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193 # released: 2026-10-26 pinned: 2026-11-22
    container_name: qontinui-canonical-redis
    restart: unless-stopped
    # PID containment — see the block above `services:`. Measured 6 PIDs.
    pids_limit: 4096
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - canonical_redis_data:/data
    # appendonly = on for crash-resilient claim audit; the durable audit
    # lives in PG, but the live claim state in Redis surviving a container
    # restart matters during dev to avoid all-claims-expire on `down`/`up`.
    #
    # requirepass is set so LAN-reachable Redis isn't a wide-open shared
    # cache. Same auth posture lifts cleanly to AWS staging/prod (just
    # supply a different REDIS_PASSWORD).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
      # Parity with AWS (module.redis parameter group): coord's
      # claims_expiry_watcher subscribes to __keyevent@0__:expired, which
      # needs expired-event notifications ("Ex").
      - --notify-keyspace-events
      - Ex
      - --requirepass
      - ${REDIS_PASSWORD:-qontinui_dev_redis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qontinui_dev_redis}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────
  # Object store — S3-compatible blob storage (dev only): versitygw.
  #
  # Replaced MinIO, whose repository GitHub reports as archived (repo API
  # `archived: true`, read 2026-11-22; the API serves no archive date, the
  # last push was 2026-04-24) (plan 2026-11-22-fetches-stop-depending-on-
  # upstreams, Phase 2). The engine was chosen by running the D7 conformance
  # subset (put, get, head, delete, multipart, presign, create-if-absent) and
  # both real clients (bazel-remote, sccache) against every candidate:
  # versitygw v1.11.0 passed all of it with the lowest idle RSS; SeaweedFS
  # 4.52 is the runner-up and the rehearsed fallback (`object-store-seaweedfs`
  # below, profile `fallback-store`). The CI job `s3 store conformance`
  # re-runs the subset against BOTH on every PR, so a store that stops
  # passing it cannot land.
  #
  # Image: built locally from ./object-store/Dockerfile — the conformance-
  # tested release tarball (sha256-pinned) on a digest-pinned alpine. The
  # upstream `versity/versitygw:v1.11.0` image is still inside D5's 14-day
  # cooldown; the Dockerfile header says why that matters.
  #
  # No console port: versitygw has no MinIO-style console, so 9101 is gone.
  # The S3 API stays on ${S3_API_PORT:-9100}, which keeps every
  # ~/.qontinui/profiles.json endpoint (http://<host>:9100) valid.
  #
  # Storage: the posix backend keeps objects as files and their metadata in
  # extended attributes, so the volume must support user xattrs. Docker's
  # local volume driver (ext4 / xfs / Docker Desktop's WSL2 ext4) does; the
  # entrypoint probes it and refuses to serve, naming the VGW_META_SIDECAR
  # remedy, on a filesystem that does not.
  #
  # Data from the old MinIO volume (still declared below, untouched) is copied
  # with scripts/s3-migrate-from-minio.sh.
  # ───────────────────────────────────────────────────────────────────────
  object-store:
    build:
      context: ./object-store
      dockerfile: Dockerfile
    image: qontinui-canonical-object-store:latest
    container_name: qontinui-canonical-object-store
    restart: unless-stopped
    # PID containment — see the block above `services:`. A single Go
    # process; MinIO measured 30 PIDs in the slot this replaced.
    pids_limit: 4096
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-qontinui_dev_s3}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-qontinui_dev_s3_secret}
      VGW_REGION: ${S3_REGION:-us-east-1}
      # Empty (the default) keeps object metadata in xattrs on /data. Set it
      # to /meta to keep metadata as sidecar files on the meta volume instead
      # — the remedy the entrypoint names on a filesystem without user xattrs.
      VGW_META_SIDECAR: ${VGW_META_SIDECAR:-}
    ports:
      - "${S3_API_PORT:-9100}:9000"
    volumes:
      - canonical_object_store_data:/data
      - canonical_object_store_meta:/meta
    # conformance: scripts/s3-conformance.py (D7 subset)
    healthcheck:
      # versitygw's own unauthenticated liveness route (`--health /health`).
      # 127.0.0.1, not localhost: busybox wget tries ::1 first.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The runner-up, behind a profile: never started by a plain `up`.
  #
  # It answers as `object-store` (network alias) on the same host port, so
  # every consumer fails over unchanged. Rehearse or switch:
  #
  #   docker compose stop object-store
  #   docker compose --profile fallback-store up -d --wait object-store-seaweedfs
  #   docker compose run --rm --no-deps object-store-init
  #
  # and back with `docker compose --profile fallback-store stop
  # object-store-seaweedfs && docker compose up -d object-store`. While the
  # fallback serves, (re)start consumers with `--no-deps` (e.g. `docker compose
  # up -d --no-deps sccache bazel-remote`): their depends_on names the
  # `object-store` SERVICE, so a plain `up` would try to start versitygw on the
  # port SeaweedFS holds. It has its
  # own volume: the two engines' on-disk layouts are not interchangeable, so a
  # switch carries data across with scripts/s3-migrate-from-minio.sh's
  # generic --source-endpoint/--dest-endpoint, not by sharing a volume.
  object-store-seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59 # released: 2026-11-02 pinned: 2026-11-22
    container_name: qontinui-canonical-object-store-seaweedfs
    profiles: ["fallback-store"]
    restart: unless-stopped
    # PID containment — see the block above `services:`.
    pids_limit: 4096
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-qontinui_dev_s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-qontinui_dev_s3_secret}
    # One `weed server` process runs master, volume, filer and the S3 gateway
    # (as in the Phase 1 run). The identities file is written from the
    # environment at start so the secret never lands in the image or argv.
    #
    # Volume sizing: SeaweedFS gives every bucket its own collection and grows
    # several volumes for each, and its defaults (30 GB volumes, a slot count
    # derived from free disk) ran out of writable volumes after a handful of
    # buckets when measured on nilan 2026-11-22 ("No writable volumes and no
    # free volumes left"). 1 GiB volumes and 200 slots fit this stack's four
    # buckets plus the CI tests' scratch buckets; volumes are not
    # preallocated, so the slot count costs no disk.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        case "$${S3_ACCESS_KEY}$${S3_SECRET_KEY}" in
          *'"'*|*'\'*) echo "S3_ACCESS_KEY / S3_SECRET_KEY must not contain a double quote or backslash (they are written into JSON)" >&2; exit 1 ;;
        esac
        umask 077
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}\n' \
          "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" > /tmp/s3-identities.json
        exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 \
          -master.volumeSizeLimitMB=1024 -volume.max=200 \
          -filer -s3 -s3.port=9000 -s3.config=/tmp/s3-identities.json
    ports:
      - "${S3_API_PORT:-9100}:9000"
    volumes:
      - canonical_object_store_fallback_data:/data
    networks:
      default:
        aliases:
          - object-store
    # conformance: scripts/s3-conformance.py (D7 subset)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Bucket-creation sidecar — runs once after the object store is healthy,
  # then exits.
  #
  # Owns these buckets:
  #   qontinui-dev                  — general dev blob store. Anonymous
  #                                   DOWNLOAD (s3:GetObject) via a bucket
  #                                   policy; anonymous listing stays refused.
  #   qontinui-bazel-remote         — content-addressed cache backing for the
  #                                   bazel-remote service below (Row 10 Item 4).
  #   qontinui-session-output-cold  — Phase 8 cold-tier PTY output (dev mirror
  #                                   of the staging session-output-cold S3
  #                                   bucket). Key layout:
  #                                   tenant/<tenant_id>/session/<session_id>.log.
  #                                   Kept PRIVATE (no bucket policy) to
  #                                   mirror staging's full public-access block —
  #                                   PTY output is sensitive; reads go through
  #                                   coord, never anonymous S3.
  #
  # Bucket creation is idempotent (head-bucket, else create-bucket); the
  # sidecar is the gate that downstream services depend on for "bucket
  # exists". The sccache container creates its own `qontinui-sccache` bucket
  # via its entrypoint — that pattern stays in place; only buckets co-owned
  # with multi-service contracts live here. The same commands work against
  # the SeaweedFS fallback, which honours bucket policies too.
  object-store-init:
    image: amazon/aws-cli:2.39.6@sha256:eccdb3ec77e159d43ca6a750a70738c546883138be7f094498294a1477ec7e42 # released: 2026-11-06 pinned: 2026-11-22
    container_name: qontinui-canonical-object-store-init
    # PID containment — see the block above `services:`. One-shot aws CLI
    # shell; bounded anyway so the aggregate ceiling covers every service.
    pids_limit: 4096
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-qontinui_dev_s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-qontinui_dev_s3_secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://object-store:9000
      # Send checksums only where the API requires them, as the conformance
      # run did; nothing here depends on the CLI's default CRC32 trailers.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        ensure_bucket() {
          aws s3api head-bucket --bucket "$$1" >/dev/null 2>&1 \
            || aws s3api create-bucket --bucket "$$1" >/dev/null
          aws s3api head-bucket --bucket "$$1"
        }
        ensure_bucket qontinui-dev
        aws s3api put-bucket-policy --bucket qontinui-dev --policy '{"Version":"2012-10-17","Statement":[{"Sid":"AnonymousDownload","Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::qontinui-dev/*"]}]}'
        ensure_bucket ${BAZEL_REMOTE_BUCKET:-qontinui-bazel-remote}
        ensure_bucket ${SESSION_OUTPUT_COLD_BUCKET:-qontinui-session-output-cold}
        echo "object-store buckets qontinui-dev + ${BAZEL_REMOTE_BUCKET:-qontinui-bazel-remote} + ${SESSION_OUTPUT_COLD_BUCKET:-qontinui-session-output-cold} ready"
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────
  # Alembic migrator — one-shot `alembic upgrade head` on `up`.
  #
  # Built from ./migrator/Dockerfile against a build context one level up
  # (`..`), so it can COPY from sibling repos qontinui-web/backend/ (alembic
  # chain + model graph) and qontinui-schemas/ (pydantic-only path dep).
  # See ./migrator/Dockerfile for the full rationale, including why we
  # use a curated dep set instead of `poetry install --only main` against
  # qontinui-web/backend (the latter would drag torch + CUDA in via the
  # heavy `qontinui` path dep).
  #
  # Connect string uses the in-stack service name `postgres` and the
  # in-container port 5432, NOT the host-mapped 5433.
  # ───────────────────────────────────────────────────────────────────────
  migrator:
    build:
      context: ..
      dockerfile: qontinui-stack/migrator/Dockerfile
    image: qontinui-canonical-migrator:latest
    container_name: qontinui-canonical-migrator
    # PID containment — see the block above `services:`. One-shot alembic.
    pids_limit: 4096
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-qontinui_user}:${POSTGRES_PASSWORD:-qontinui_dev_password}@postgres:5432/${POSTGRES_DB:-qontinui_db}
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────
  # Alembic status sidecar — long-running observability surface.
  #
  # Runs the same image as the migrator but with a no-op command, so the
  # container stays alive for healthchecks. Its docker healthcheck
  # (/alembic_at_head.sh) compares `alembic current` (DB-stamped rev)
  # to `alembic heads` (chain head from the embedded alembic/versions/).
  # The check reports UNHEALTHY on: empty alembic_version, a DB stamped
  # at more than one revision (branched), multi-head divergence (the
  # 2026-05-07 failure mode), or current != head (post-migration
  # silent-failure fallout) — and UNDETERMINED when an `alembic`
  # invocation itself FAILED, or succeeded and named no head, so nothing
  # about the DB was established. A chain with no head is a defect of the
  # IMAGE, not a verdict about the DB, which is why it lands there.
  # Docker has no third state, so UNDETERMINED is also a non-zero exit:
  # an unhealthy sidecar does NOT on its own mean any particular one of
  # those conditions holds — read the message, which names which branch
  # fired. This list is a summary and goes stale; the script header is
  # the authoritative one.
  #
  # Why a sidecar instead of augmenting postgres's healthcheck:
  #   - postgres is the postgres image; it doesn't have alembic or the
  #     chain. Injecting them would fork the upstream image.
  #   - This decouples "is PG accepting connections?" (postgres health)
  #     from "is the schema at head?" (alembic-status health). External
  #     observers pick whichever signal matches their concern.
  #   - The migrator-success gate on coord (line 211) handles the
  #     in-stack startup ordering. This sidecar is purely for external
  #     visibility — `docker inspect`, supervisor probes, CI smoke
  #     scripts, future Prometheus exporters.
  #
  # depends_on migrator: service_completed_successfully — without this,
  # the sidecar would briefly report unhealthy (current != head) on a
  # cold start while the migrator is still running. Gating on migrator
  # completion makes "starting" → "healthy" the only legitimate
  # transition.
  # ───────────────────────────────────────────────────────────────────────
  alembic-status:
    image: qontinui-canonical-migrator:latest
    container_name: qontinui-canonical-alembic-status
    restart: unless-stopped
    # PID containment — see the block above `services:`. Measured 38 PIDs.
    pids_limit: 4096
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-qontinui_user}:${POSTGRES_PASSWORD:-qontinui_dev_password}@postgres:5432/${POSTGRES_DB:-qontinui_db}
    # `tini` is PID-1 so signals to the container terminate cleanly.
    # `sleep infinity` keeps the container alive without burning CPU.
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["sh", "-c", "exec sleep infinity"]
    healthcheck:
      test: ["CMD", "/alembic_at_head.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ───────────────────────────────────────────────────────────────────────
  # qontinui canonical sccache — LAN-shared rustc compile-unit cache.
  #
  # Row 2 Phase 2 of the fleet topology design
  # (plans/2026-05-14-fleet-topology-and-build-pool-design.md §3.3).
  # The shared cache itself lives in the object store under bucket
  # `qontinui-sccache`;
  # each agent / build machine runs a local sccache daemon configured to
  # talk S3 to that bucket. This container's role is:
  #
  #   1. Idempotently create the `qontinui-sccache` bucket at boot.
  #   2. Expose stats HTTP for the coord `/metrics` scraper (:4227).
  #   3. Pre-stage a dormant sccache server (:4226) for Phase 6
  #      cloud-burst CI workers that will compile inside containers.
  #
  # Port convention follows the rest of the stack: sccache default daemon
  # port 4226 stays internal-only (host-mapped for Phase 6); stats HTTP at
  # 4227 is host-exposed so coord on :9870 can scrape it over the LAN.
  # ───────────────────────────────────────────────────────────────────────
  sccache:
    build:
      context: ./sccache
      dockerfile: Dockerfile
    image: qontinui-canonical-sccache:latest
    container_name: qontinui-canonical-sccache
    restart: unless-stopped
    # PID containment — see the block above `services:`. Measured 68 PIDs,
    # the highest steady-state reading in the stack; 4096 is ~60x it.
    pids_limit: 4096
    depends_on:
      object-store:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    environment:
      SCCACHE_BUCKET: ${SCCACHE_BUCKET:-qontinui-sccache}
      # host:port inside the stack network. The host-side override is
      # SCCACHE_STORE_ENDPOINT, deliberately NOT SCCACHE_ENDPOINT, so a shell
      # configured for the cross-machine lane (docs/sccache-cross-machine.md)
      # cannot repoint this container by accident.
      SCCACHE_ENDPOINT: ${SCCACHE_STORE_ENDPOINT:-object-store:9000}
      SCCACHE_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-qontinui_dev_s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-qontinui_dev_s3_secret}
      SCCACHE_STATS_PORT: "4227"
    ports:
      - "${SCCACHE_DAEMON_PORT:-4226}:4226"
      - "${SCCACHE_STATS_PORT:-4227}:4227"
    healthcheck:
      # Hit 127.0.0.1 explicitly: alpine's busybox wget tries IPv6 (::1)
      # first for `localhost`, but Python's stdlib HTTPServer binds
      # IPv4-only, so the healthcheck would otherwise fail with
      # "Connection refused" while the service is happily up.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4227/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ───────────────────────────────────────────────────────────────────────
  # bazel-remote — content-addressed build cache (CAS) + ActionResult (AC).
  #
  # Row 10 Item 4 of the validation-freshness implementation tracker
  # (plans/2026-05-14-row-10-implementation-tracker.md). The supervisor
  # build pool will (in Items 5–7) extend its current timestamp-keyed
  # reuse to a content-hash key derived by `canonical_diff_hash.py`, then
  # query bazel-remote's AC at that key before dispatching a build. This
  # container is just the backing store; integration is Wave 4+.
  #
  # Topology:
  #   - HTTP API on host :9094 (container :8080) — REST CAS + AC routes
  #     used by the spike + (eventually) supervisor pool. `:8080` is
  #     hardcoded in the upstream image entrypoint (`--http_address=:8080`).
  #   - gRPC on host :9095 (container :9092) — REAPI gRPC for native
  #     Bazel-style clients; reserved for Item 7+ once supervisor writes
  #     real ActionResult protobufs.
  #   - Local disk cache at /data (volume-mounted) acts as the hot tier.
  #   - S3 backing against the canonical object store's bucket
  #     `qontinui-bazel-remote` is the durable cold tier: blobs survive
  #     container restart even after the local volume is wiped.
  #
  # Image: `buchgr/bazel-remote-cache:v2.6.4`, the project's own image, at
  # the release whose S3 round trip against the object store was measured in
  # the store conformance run (plan 2026-11-22-fetches-stop-depending-on-
  # upstreams, Phase 1). It replaced `muxinc/bazel-remote:latest`, a 2020
  # third-party mirror of a v1 binary that was never digest-pinnable to a
  # maintained build.
  #
  # The upstream image is distroless (no shell, no wget), so this service
  # has NO in-container healthcheck — there is nothing in the image to run
  # one with, and nothing in this file waits on its health. The health signal
  # is host-side instead: `bash scripts/bazel-remote-probe.sh` reads /status
  # through the published port and exits 0 (healthy), 1 (answered wrong) or 2
  # (no answer — UNKNOWN, not "down").
  #
  # AC validation: ON (Row 10 Item 7, 2026-05-15). The supervisor build
  # pool now writes real REAPI `ActionResult` protobufs
  # (qontinui-supervisor src/reapi.rs), so bazel-remote validates every
  # HTTP AC PUT — body must parse as `build.bazel.remote.execution.v2
  # .ActionResult` and every referenced digest must already be in CAS.
  # The `--disable_http_ac_validation` flag was removed once the
  # supervisor synthetic round-trip (tests/row10_cache_synthetic.rs)
  # proved the protobuf passes validation. Do NOT re-add the flag: any
  # legacy JSON-pointer AC body (Items 5-6 interim, never shipped — 5-7
  # landed together) would now be rejected, which is the intended
  # behavior.
  # ───────────────────────────────────────────────────────────────────────
  bazel-remote:
    image: buchgr/bazel-remote-cache:v2.6.4@sha256:10285c1183e606679eb450b725c2495c055a45eb532a6c80f6b6f9771f6d2f67 # released: 2026-10-20 pinned: 2026-11-22
    container_name: qontinui-canonical-bazel-remote
    restart: unless-stopped
    # Runs as the image's own non-root uid 65532; bazel-remote-init (below)
    # hands the volume to that uid first, since the image this replaced wrote
    # it as root.
    # PID containment — see the block above `services:`. Measured 34 PIDs.
    pids_limit: 4096
    depends_on:
      object-store:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
      bazel-remote-init:
        condition: service_completed_successfully
    # Image entrypoint hardcodes `--http_address=:8080 --dir=/data`;
    # `command` flags below append. --max_size is required by the binary
    # so cache size is bounded. S3 flags route to the canonical object store
    # over plain HTTP (--s3.disable_ssl) since the in-stack bridge is local.
    # The S3 key pair comes from the environment, which bazel-remote reads
    # as well as flags, so the secret stays off argv.
    command:
      - --max_size=${BAZEL_REMOTE_MAX_SIZE_GIB:-50}
      - --grpc_address=:9092
      - --s3.endpoint=${BAZEL_REMOTE_S3_ENDPOINT:-object-store:9000}
      - --s3.bucket=${BAZEL_REMOTE_BUCKET:-qontinui-bazel-remote}
      - --s3.auth_method=access_key
      - --s3.region=${S3_REGION:-us-east-1}
      - --s3.disable_ssl
    environment:
      BAZEL_REMOTE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-qontinui_dev_s3}
      BAZEL_REMOTE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-qontinui_dev_s3_secret}
    ports:
      - "${BAZEL_REMOTE_HTTP_PORT:-9094}:8080"
      - "${BAZEL_REMOTE_GRPC_PORT:-9095}:9092"
    volumes:
      - canonical_bazel_remote_data:/data

  # One-shot: give the bazel-remote volume to the image's non-root uid
  # (65532, distroless `nonroot`). Idempotent: it looks for the FIRST entry
  # anywhere under /data not owned by 65532:65532 (`find ... -print -quit`,
  # which stops at one) and only then chowns the whole tree, so a volume whose
  # top directory is right but whose contents are root-owned is still fixed.
  bazel-remote-init:
    image: alpine:3.23.7@sha256:ff7f0c727dd796aa36787bfcd9a64bf35a6ce72a73451b3359fde849b6703d63 # released: 2026-10-23 pinned: 2026-11-22
    container_name: qontinui-canonical-bazel-remote-init
    # PID containment — see the block above `services:`. One-shot chown.
    pids_limit: 4096
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -n "$$(find /data \( ! -user 65532 -o ! -group 65532 \) -print -quit)" ]; then
          chown -R 65532:65532 /data
          echo "bazel-remote volume handed to uid 65532"
        else
          echo "bazel-remote volume already owned by uid 65532"
        fi
    volumes:
      - canonical_bazel_remote_data:/data
    restart: "no"

  # ───────────────────────────────────────────────────────────────────────
  # NATS JetStream — durable, replayable event streams.
  #
  # Row 9 Phase 1 (per plans/2026-05-14-failure-modes-at-scale-design.md
  # §3.1): a 3-node cluster fronts every event channel that needs
  # at-least-once delivery semantics. Redis pub/sub stays in service
  # alongside; coord dual-publishes during the 2-week burn-in.
  #
  # Port choices: 4223 (client) and 8223 (monitor) on the host, mapped
  # to 4222 / 8222 inside the containers. Follows the same "+1 offset"
  # convention as postgres (5433→5432) and redis (6380→6379). Cluster
  # routes on 6222 are container-internal only — no host exposure.
  #
  # All three nodes share their JetStream store via per-node named
  # volumes; streams survive container restarts. mTLS is the
  # production target (design §3.1) but deferred to Phase 2 hardening;
  # Phase 1 uses shared-secret cluster auth + a client user/password
  # pair, same posture as redis `requirepass`.
  # ───────────────────────────────────────────────────────────────────────
  nats-1:
    image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 # released: 2026-01-28 pinned: 2026-11-22
    container_name: qontinui-canonical-nats-1
    restart: unless-stopped
    # PID containment — see the block above `services:`. Measured 19 PIDs.
    pids_limit: 4096
    command:
      - "--config=/etc/nats/nats-1.conf"
    environment:
      CLIENT_USER: ${NATS_CLIENT_USER:-qontinui_client}
      CLIENT_PASSWORD: ${NATS_CLIENT_PASSWORD:-qontinui_dev_nats}
      CLUSTER_PASSWORD: ${NATS_CLUSTER_PASSWORD:-qontinui_dev_nats_cluster}
    ports:
      - "${NATS_CLIENT_PORT:-4223}:4222"
      - "${NATS_MONITOR_PORT:-8223}:8222"
    volumes:
      - ./nats-config/nats-1.conf:/etc/nats/nats-1.conf:ro
      - canonical_nats_1_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats-2:
    image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 # released: 2026-01-28 pinned: 2026-11-22
    container_name: qontinui-canonical-nats-2
    restart: unless-stopped
    # PID containment — see the block above `services:`. Measured 18 PIDs.
    pids_limit: 4096
    command:
      - "--config=/etc/nats/nats-2.conf"
    environment:
      CLIENT_USER: ${NATS_CLIENT_USER:-qontinui_client}
      CLIENT_PASSWORD: ${NATS_CLIENT_PASSWORD:-qontinui_dev_nats}
      CLUSTER_PASSWORD: ${NATS_CLUSTER_PASSWORD:-qontinui_dev_nats_cluster}
    volumes:
      - ./nats-config/nats-2.conf:/etc/nats/nats-2.conf:ro
      - canonical_nats_2_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nats-3:
    image: nats:2.10.29-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927 # released: 2026-01-28 pinned: 2026-11-22
    container_name: qontinui-canonical-nats-3
    restart: unless-stopped
    # PID containment — see the block above `services:`. Measured 17 PIDs.
    pids_limit: 4096
    command:
      - "--config=/etc/nats/nats-3.conf"
    environment:
      CLIENT_USER: ${NATS_CLIENT_USER:-qontinui_client}
      CLIENT_PASSWORD: ${NATS_CLIENT_PASSWORD:-qontinui_dev_nats}
      CLUSTER_PASSWORD: ${NATS_CLUSTER_PASSWORD:-qontinui_dev_nats_cluster}
    volumes:
      - ./nats-config/nats-3.conf:/etc/nats/nats-3.conf:ro
      - canonical_nats_3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────
  # Jaeger all-in-one — OpenTelemetry trace backend (Row 9 Phase 5).
  #
  # Single-container deployment with the OTLP receiver (gRPC :4317, HTTP
  # :4318) and the Jaeger UI (:16686). All-in-one writes to in-memory
  # storage by default — fine for the v1 burn-in / dev box; production
  # observability stack (Tempo, Honeycomb, Datadog) is a Phase 6+ choice.
  #
  # Per Row 9 design §3.6: trace IDs propagate via traceparent over HTTP
  # and via NATS message headers; coord / supervisor / runner all export
  # to this collector. Sampling defaults are coded into the services
  # (1% baseline, 100% for tagged events).
  #
  # Ports:
  #   16686 → Jaeger UI (browse traces at http://localhost:16686)
  #   4317  → OTLP gRPC receiver (services point here via OTEL_EXPORTER_OTLP_ENDPOINT)
  #   4318  → OTLP HTTP receiver (services that prefer HTTP/JSON)
  #
  # When the host already binds 4317/4318 (running collector, dev tools),
  # override via env vars before `docker compose up`.
  # ───────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f # released: 2024-10-07 pinned: 2026-11-22
    container_name: qontinui-canonical-jaeger
    restart: unless-stopped
    # PID containment — see the block above `services:`. Measured 18 PIDs.
    pids_limit: 4096
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Cap the in-memory store so a runaway trace volume can't OOM the box.
      MEMORY_MAX_TRACES: "${JAEGER_MAX_TRACES:-50000}"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      # /api/services is the cheapest endpoint that proves the collector
      # is responsive — returns 200 with `{"data": null, ...}` when no
      # traces have arrived yet.
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:16686/api/services"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────
  # qontinui-coord — coordinator service.
  #
  # Built from ../qontinui-coord/Dockerfile. Terminates WebSockets,
  # ingests GitHub webhooks (HMAC-validated, republished on Redis), and
  # fronts the canonical PG + Redis. See ../qontinui-coord/README.md.
  #
  # In-stack DSNs use the service names (postgres, redis), not the
  # host-mapped ports. GITHUB_WEBHOOK_SECRET is intentionally unset by
  # default so the endpoint rejects all requests until the operator
  # configures the shared secret in .env.
  # ───────────────────────────────────────────────────────────────────────
  coord:
    build:
      context: ../qontinui-coord
      dockerfile: Dockerfile
      secrets:
        - dn_token
    # Cutover 2026-05-16: unpinned from :pre-phase5-pinned to :latest after
    # canonical-PG upgrade (wave_7_01_merge_heads single head) completed via
    # Session B's reconcile-then-stamp program. :pre-phase5-pinned image preserved
    # locally as rollback target if needed.
    image: qontinui-canonical-coord:latest
    container_name: qontinui-canonical-coord
    restart: unless-stopped
    # PID containment — the service this bound exists for. See the full
    # argument in the block above `services:`.
    #
    # This is the container that reached 190,840 PIDs on 2026-08-27 and took
    # the VM's fork() with it. coord#1671's tini entrypoint stops THAT leak
    # (orphaned `git` grandchildren) at the image level, correctly, for both
    # compose and ECS. This bounds the cgroup so the NEXT one — in coord or
    # in any image here we do not author — cannot leave the container.
    #
    # Sized not to clip coord's own work: ~148 concurrent `git` invocations
    # in a merge-train window, ~1-3 tasks each, plus its tokio runtime, is
    # ~520 tasks worst case. 4096 leaves ~8x headroom over that and is still
    # only 2.1% of the VM's 192,146 `threads-max`.
    #
    # ECS is deliberately NOT the twin of this line: `pidsLimit` is not
    # supported on Fargate, and it does not need to be — each Fargate task
    # gets its own microVM, so a coord PID leak there cannot starve a
    # sibling. The shared-kernel blast radius is a compose-stack property.
    # Verify with `docker inspect qontinui-canonical-coord --format
    # '{{.HostConfig.PidsLimit}}'` after the next recreate.
    pids_limit: 4096
    # `migrator: service_completed_successfully` makes a migrator
    # failure (multi-head divergence, broken DDL, transient PG hiccup)
    # block coord startup loudly, instead of letting coord come up
    # against an under-migrated DB and emit "column X does not exist"
    # 500s into runtime logs that nobody reads. Alembic upgrade is
    # idempotent (no-op when already at head), so the gate is cheap on
    # the happy path and load-bearing on the failure path.
    # Background: 2026-05-07 multi-head divergence
    # (cr01a2b3c4d5 + 7c5e4d3b2a1f) had the migrator exit 255 four
    # hours before anyone noticed, because nothing depended on its
    # success. See investigation in
    # qontinui-web@5d320ffb / qontinui-runner@1d984230f.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      # NATS gate is best-effort: coord retries the JetStream connection
      # in-process. Gating on `service_healthy` is still preferred so
      # the first PUBLISH after coord boot doesn't race a cold cluster.
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy
      # Jaeger gate is best-effort like NATS: coord retries OTLP exports
      # internally. Gating on `service_healthy` is preferred so the first
      # exported span after coord boot doesn't race a cold collector.
      jaeger:
        condition: service_healthy
    ports:
      - "${COORD_PORT:-9870}:9870"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qontinui_user}:${POSTGRES_PASSWORD:-qontinui_dev_password}@postgres:5432/${POSTGRES_DB:-qontinui_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-qontinui_dev_redis}@redis:6379/0
      # Single-URL form (Gap 2 workaround, 2026-05-17). async-nats 0.48's
      # connect(&str) treats a comma-separated NATS_URL as ONE URL and
      # fails to parse the second host's `:4222` as a port; the existing
      # `split_url_creds` workaround in nats_streams.rs handles
      # user:pass@host auth extraction but not multi-URL splitting. Single
      # entry point still lets the NATS cluster mesh handle internal
      # routing; loses only cold-boot failover to nats-2/-3 if nats-1 is
      # the slow starter. Proper fix queued as a coord PR: split on `,`
      # and pass Vec<String> to connect. See
      # feedback_async_nats_url_creds_rejected + Gap 2 in
      # proj_deployment_config_gaps_2026-05-rollout.
      NATS_URL: nats://${NATS_CLIENT_USER:-qontinui_client}:${NATS_CLIENT_PASSWORD:-qontinui_dev_nats}@nats-1:4222
      COORD_BIND_ADDR: 0.0.0.0:9870
      # Cognito OIDC verification — was entirely unset here (coord-side gap,
      # found 2026-08-24 diagnosing a pair-cli 400 tenant_id_required loop:
      # web stopped sending tenant_id in the body and relies on coord
      # deriving it from the forwarded operator bearer, but with
      # COORD_OIDC_ISSUER unset coord can never verify that bearer and
      # always falls through to tenant_id_required). Both client lists below
      # are PRODUCTION coord's, verbatim (qontinui-coord deploy/taskdef.json),
      # so every token prod coord accepts verifies here with the same
      # read-only/write split (roles differ: prod's admin bootstrap and group
      # mappings are not set here): the web / runner / mobile / CI clients web
      # also accepts, plus the three that call coord directly — coord-dashboard
      # 1r83igrltq3hfko2fnifhmjvvk, coord-verify 6k0mt7h1gk4raam66bpkcnlo9f and
      # the IAM-gated headless-ops 6j1gc0r988qu1g6qaou0pb4isb. Keep both in
      # sync with the taskdef: a client prod accepts and this stack refuses
      # is the web<->coord audience drift qontinui-coord 31028596 had to fix.
      # COORD_OIDC_JWKS_URL is left unset — coord derives it as
      # <issuer>/.well-known/jwks.json.
      COORD_OIDC_ISSUER: ${COORD_OIDC_ISSUER:-https://cognito-idp.us-east-1.amazonaws.com/us-east-1_rgTB9dbZ1}
      COORD_OIDC_AUDIENCE: ${COORD_OIDC_AUDIENCE:-1r83igrltq3hfko2fnifhmjvvk,6k0mt7h1gk4raam66bpkcnlo9f,q6ns1a8bokf2np1mj8v8arl31,tb0epbojige1900ipu6q80j6b,7sirquecq6svomsoe34pblfp24,6j1gc0r988qu1g6qaou0pb4isb,67f2a1a0cmgileob23lniud5t7}
      # The read-only half of the audience list above. A token whose aud /
      # client_id is in this set gets a non-interactive OperatorContext and
      # every mutating route answers 403 (auth_sso.rs
      # noninteractive_audiences, auth::deny_non_interactive_write). Setting
      # COORD_OIDC_AUDIENCE without it silently promotes password-mintable
      # clients — tb0epbojige1900ipu6q80j6b is the USER_PASSWORD_AUTH CI
      # client web's spec-CI / E2E use — to full WRITE authority. Two
      # password-mintable clients stay interactive in prod and so here:
      # headless-ops by recorded decision (qontinui-coord f1ae10a2 — admin
      # flow only, IAM-gated; now expressed below via
      # COORD_OIDC_INTERACTIVE_MINTABLE_AUDIENCES rather than left
      # unclassified), and the runner client 67f2a1a0cmgileob23lniud5t7,
      # which allows public USER_PASSWORD_AUTH — it joined the audience later,
      # for a read (qontinui-coord 31028596), and stays interactive by
      # recorded decision (qontinui-coord question 9c987ab8, Answer 1),
      # likewise expressed below (qontinui-coord PR #2220). Reclassifying
      # either is a prod decision: change deploy/taskdef.json first, then
      # mirror it here.
      COORD_OIDC_NONINTERACTIVE_AUDIENCES: ${COORD_OIDC_NONINTERACTIVE_AUDIENCES:-6k0mt7h1gk4raam66bpkcnlo9f,tb0epbojige1900ipu6q80j6b,7sirquecq6svomsoe34pblfp24}
      # The DECLARED interactive-on-purpose half: password-mintable clients
      # that stay interactive by recorded decision. OBSERVER-ONLY — coord's
      # auth observer reports them under machine_mintable_declared_interactive
      # instead of raising the critical auth-client-aud-wiring alert; token
      # authority is still decided by the non-interactive set alone
      # (auth_sso.rs interactive_mintable_audiences). Each entry is
      # <client_id>:<FLOW>[+<FLOW>] and exempts the client only while its live
      # password-mintable flows stay within the declared ones — a flow added
      # later negates again. headless-ops is declared here per f1ae10a2 (admin
      # flow only); the runner client is declared per question 9c987ab8
      # Answer 1 (keep interactive), public password flow only, so gaining the
      # admin flow would negate it again. Mirrors the taskdef verbatim.
      COORD_OIDC_INTERACTIVE_MINTABLE_AUDIENCES: ${COORD_OIDC_INTERACTIVE_MINTABLE_AUDIENCES:-6j1gc0r988qu1g6qaou0pb4isb:ALLOW_ADMIN_USER_PASSWORD_AUTH,67f2a1a0cmgileob23lniud5t7:ALLOW_USER_PASSWORD_AUTH}
      # New operators (by Cognito sub) auto-join this tenant on first
      # successful local-coord login — this is local-dev-only state,
      # independent of any production tenant membership. Matches the
      # convention Start-LocalCoord already uses for the VerifyWeb coord.
      COORD_SSO_DEFAULT_TENANT: ${COORD_SSO_DEFAULT_TENANT:-default}
      # Deployment profile (plan 2026-10-10-spec-front-end-phase-9-generic-boundary
      # C7). `hosted` (default): the six egress_* fleet-policy domains — the
      # outbound data flows a runner sends off its machine — default ON.
      # `self_hosted`: they default OFF until a tenant admin turns one on. Any
      # other value refuses coord startup.
      COORD_DEPLOYMENT_PROFILE: ${COORD_DEPLOYMENT_PROFILE:-hosted}
      # JWT signing key persistence — found 2026-08-24 alongside the OIDC gap
      # above: coord's default key path is under $HOME
      # (~/.qontinui/coord-jwt-ed25519.pkcs8, jwt.rs::key_path), which is
      # ephemeral container filesystem here (no volume mounted at $HOME), so
      # every container recreate minted a FRESH signing keypair and silently
      # invalidated every previously-issued device JWT — the runner's WS auth
      # then failed against the web backend's cached (now-stale) JWKS,
      # producing an endless "Reconnecting…" loop that looked unrelated to
      # pairing. Point it at the already-persistent coord-mirrors volume
      # instead of minting a new volume for one small file.
      COORD_JWT_KEY_PATH: ${COORD_JWT_KEY_PATH:-/var/lib/qontinui-coord/mirrors/.coord-jwt-ed25519.pkcs8}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Strategy Phase 1 service-account JWT bridge — coord mints/verifies
      # JWTs for qontinui-web's StrategyClient. Unset = 503 on
      # /coord/auth/service-token (feature off, fail-closed). Same value
      # must be present in qontinui-web backend env for mint/verify
      # symmetry. Added 2026-05-17 per Gap 5 in
      # proj_deployment_config_gaps_2026-05-rollout.
      COORD_ADMIN_SECRET: ${COORD_ADMIN_SECRET:-}
      # Strategy Phase 1 substrate root — coord reads strategy docs from
      # this path via `git -C <path>` subprocess. Path points one level
      # INTO the bind-mount because coord needs .git to be reachable
      # from the substrate dir (git walks up). The mount source is the
      # whole qontinui-dev-notes repo (read-only); coord's
      # `safe_doc_name` guards path traversal so only `*.md` under
      # project-strategy/ is reachable via /strategy/docs.
      STRATEGY_SUBSTRATE_PATH: /app/strategy-substrate/project-strategy
      # Phase 5B.5 — sibling-repo clones land here. Persistent volume so
      # clones survive container restarts; otherwise every up cycle would
      # re-clone every tracked repo from scratch.
      COORD_MIRRORS_ROOT: /var/lib/qontinui-coord/mirrors
      # GITHUB_TOKEN is optional; required only for cloning private
      # qontinui-web. When unset, public-repo enrichment still works.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Row 2 Phase 2 — sccache stats scrape target. Coord aggregates
      # bucket-side counters (object count, total size) from this URL on
      # its /metrics endpoint. Unset disables sccache stats reporting
      # (the rest of /metrics keeps working).
      SCCACHE_STATS_URL: ${SCCACHE_STATS_URL:-http://sccache:4227}
      RUST_LOG: ${COORD_RUST_LOG:-qontinui_coord=info,axum=info,tower_http=info}
      # Row 9 Phase 5 — OpenTelemetry export. Unset disables tracing; the
      # coord process logs at startup and continues without OTel. The
      # baseline sample rate is 1% (per design §3.6); the
      # `TaggedSampler` promotes tagged spans (auth-failure,
      # partition-event, cache-miss-cold, merge-conflict) to 100%
      # regardless of the baseline rate.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      OTEL_SERVICE_NAME: ${COORD_OTEL_SERVICE_NAME:-qontinui-coord}
      OTEL_TRACES_SAMPLER_ARG: ${COORD_OTEL_SAMPLE_RATE:-0.01}
    volumes:
      - canonical_coord_mirrors:/var/lib/qontinui-coord/mirrors
      # Strategy Phase 1 substrate — read-only bind of the host's
      # qontinui-dev-notes repo. Mount is the WHOLE repo (not just
      # project-strategy/) because coord's `git -C <substrate>` needs
      # `.git` reachable from the substrate dir; .git lives at the
      # repo root, not inside project-strategy/. STRATEGY_SUBSTRATE_PATH
      # points one level INTO this mount (project-strategy/) so
      # /strategy/docs serves only those files; safe_doc_name guards
      # path traversal. Blast radius: 87MB of internal dev notes,
      # read-only, no credentials in tree. Added 2026-05-17 per Gap 5
      # in proj_deployment_config_gaps_2026-05-rollout.
      - type: bind
        source: D:/qontinui-root/qontinui-dev-notes
        target: /app/strategy-substrate
        read_only: true
      # Phase B.1 (Gap 1) — docker socket bind for the canary watchers
      # (alembic_status_watcher, jetstream_health_watcher) to shell to
      # `docker inspect` against sibling canonical-stack containers.
      # Read-only: coord queries health status, never mutates the
      # daemon. Pairs with `docker.io` in qontinui-coord/Dockerfile
      # (coord PR #32, 2026-05-17). Without the socket, the CLI is
      # present but every probe fails with "Cannot connect to the
      # Docker daemon" and the alerts never fire.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true

# ───────────────────────────────────────────────────────────────────────────
# Volumes — explicit names so `docker compose down` doesn't take them out;
# only `docker compose down -v` wipes data. Matches qontinui-web's
# convention.
# ───────────────────────────────────────────────────────────────────────────
volumes:
  canonical_postgres_data:
    name: qontinui_canonical_postgres_data
  canonical_redis_data:
    name: qontinui_canonical_redis_data
  canonical_coord_mirrors:
    name: qontinui_canonical_coord_mirrors
  canonical_object_store_data:
    name: qontinui_canonical_object_store_data
  canonical_object_store_meta:
    name: qontinui_canonical_object_store_meta
  canonical_object_store_fallback_data:
    name: qontinui_canonical_object_store_fallback_data
  # The retired MinIO's data. Declared but mounted by nothing, so neither
  # `up` nor `down` touches it (only `down -v` would): it is the source
  # scripts/s3-migrate-from-minio.sh copies from, and it is kept until an
  # operator decides it is no longer needed. Nothing is deleted by the swap.
  canonical_minio_data:
    name: qontinui_canonical_minio_data
  canonical_bazel_remote_data:
    name: qontinui_canonical_bazel_remote_data
  canonical_nats_1_data:
    name: qontinui_canonical_nats_1_data
  canonical_nats_2_data:
    name: qontinui_canonical_nats_2_data
  canonical_nats_3_data:
    name: qontinui_canonical_nats_3_data

# ───────────────────────────────────────────────────────────────────────────
# Secrets — file-backed, consumed only at build time via
# `--mount=type=secret` in qontinui-coord/Dockerfile. Never baked into an image
# layer or exposed as an env var at runtime. Default path resolves under this
# compose file's directory; override with DN_TOKEN_FILE if the operator keeps it
# elsewhere.
#
# `dn_token` — a GitHub PAT with Contents:Read on the PRIVATE
# qontinui/qontinui-dev-notes repo. Its ONE use (qontinui-coord/Dockerfile:141)
# is to clone that repo into /srv/dev-notes as coord's STRATEGY SUBSTRATE
# (STRATEGY_SUBSTRATE_PATH). It has nothing to do with the merge-train git
# mirrors — those live in the `canonical_coord_mirrors` volume declared above
# and need no build secret.
#
# An ABSENT file has no blast radius: compose resolves a build secret only for
# the service actually being built, so `docker compose config` and `up` of any
# other service still succeed. Only `build coord` fails, naming the path it
# could not stat (measured, Docker/Compose 29.4.0, 2026-08-30).
# ───────────────────────────────────────────────────────────────────────────
secrets:
  dn_token:
    file: ${DN_TOKEN_FILE:-./secrets/dn_token}

# Default network (`qontinui-stack_default`) is created automatically and
# isolates this stack from the legacy qontinui-web stack. Connections from
# the host (or LAN) target the published ports; in-stack services
# (migrator → postgres) use service names.
